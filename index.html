<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IMAGER-37 服務據點查詢</title>

    <link rel="stylesheet" href="style.css" />
    <script src="stores.js"></script>
    <script src="app.js"></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAWaJ5y00KT2KJ252n8vNBbkgJUDlHs21E"></script>
</head>

<body>

    <div class="top-bar">
        <div class="top-bar-left">
            <a href="https://www.imager-37.com.tw/" class="top-bar-logo-link" aria-label="返回 IMAGER-37 官網">
                <img src="logo-imager37.png" alt="IMAGER-37 易眠床・易眠枕" class="top-bar-logo" />
            </a>
            <img src="slogan.png" alt="睡飽了，自然就會想微笑:)" class="top-bar-slogan" />
        </div>
        <a href="https://www.imager-37.com.tw/" class="top-bar-link">
            返回IMAGER-37官網
            <svg class="top-bar-link-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="12" fill="currentColor" />
                <path fill="#fff" transform="translate(5 5.5) scale(0.6)"
                    d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z" />
            </svg>
        </a>
    </div>

    <div class="layout">

        <div class="sidebar">

            <h2 class="sidebar-title">
                <img src="mascot.png" alt="" class="sidebar-mascot" />
                服務據點查詢
            </h2>

            <input
            id="searchBox"
            placeholder="搜尋門市 / 地址"
            />

            <button id="filterToggle" class="filter-btn" type="button">
            條件篩選
            </button>


            <div id="filterPanel" class="filter-panel">

            <select id="regionFilter">
                <option value="">全部地區</option>
                <option value="台北">台北</option>
                <option value="新北">新北</option>
                <option value="桃園">桃園</option>
                <option value="新竹">新竹</option>
                <option value="台中">台中</option>
                <option value="嘉義">嘉義</option>
                <option value="台南">台南</option>
                <option value="高雄">高雄</option>
            </select>


            <label class="filter-check">
                <input
                type="checkbox"
                id="electricBedFilter"
                >
                電動床陳列櫃點
            </label>


            <label class="filter-check">
                <input
                type="checkbox"
                id="pressureBedFilter"
                >
                防褥瘡床墊陳列櫃點
            </label>

            </div>

            <div id="resultCount"></div>
            <div id="filterChips"></div>
            <div id="storeList"></div>

        </div>

        <div id="map"></div>
    </div>

</body>

</html>
